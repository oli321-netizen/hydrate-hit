name: GitHub Pages

on:
  push:
    branches: [main, cursor/hydrate-hit-site-c823]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Drop API routes for static export
        run: rm -rf src/app/api
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_CUSTOM_DOMAIN: hydrationhit.com
          CUSTOM_DOMAIN: hydrationhit.com
          NEXT_PUBLIC_SITE_URL: https://hydrationhit.com
          NEXT_PUBLIC_WAITLIST_ENDPOINT: ${{ secrets.WAITLIST_ENDPOINT }}
          NEXT_PUBLIC_FORMSPREE_ID: ${{ secrets.FORMSPREE_ID }}
          NEXT_PUBLIC_GETFORM_ID: ${{ secrets.GETFORM_ID }}
      - name: Add .nojekyll
        run: touch out/.nojekyll
      - name: Publish custom domain CNAME
        run: echo "hydrationhit.com" > out/CNAME
      - name: Guard custom-domain asset paths
        run: |
          if grep -R --include='*.html' -E 'src="/hydrate-hit/|href="/hydrate-hit/' out; then
            echo "Project basePath leaked into custom-domain export."
            exit 1
          fi
          grep -q 'tins/blue-razz.jpg' out/index.html
          grep -q 'hydrationhit.com' out/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          force_orphan: true
          enable_jekyll: false
          cname: hydrationhit.com

  deploy:
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable and configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Attach hydrationhit.com and HTTPS
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -f cname='hydrationhit.com' \
            -f build_type='legacy' \
            -f source[branch]='gh-pages' \
            -f source[path]='/' \
            || true
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -f cname='hydrationhit.com' \
            -F https_enforced=true \
            || true
